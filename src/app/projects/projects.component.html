<section class="projects-hero">
  <h1 class="projects-hero-title">My Projects</h1>
  <p class="projects-hero-subtitle">Building innovative solutions with modern web technologies</p>
</section>

<section class="projects-section">
  <div class="projects-grid">
    <div class="project-card scroll" *ngFor="let project of projects; let i = index">
      <div class="spotlight"></div>

      <div class="featured-badge" *ngIf="project.tag">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
          <path fill="currentColor"
            d="m5.825 22l1.625-7.025L2 10.25l7.2-.625L12 3l2.8 6.625l7.2.625l-5.45 4.725L18.175 22L12 18.275Z" />
        </svg>
        {{project.tag}}
      </div>

      <div class="project-image-container">
        <img [src]="project.image" [alt]="project.title + ' screenshot'" class="project-image">
        <div class="image-overlay">
          <button class="preview-btn" *ngIf="project.demo" (click)="openLink(project.demo)">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24">
              <path fill="currentColor"
                d="M12 9a3 3 0 0 0-3 3a3 3 0 0 0 3 3a3 3 0 0 0 3-3a3 3 0 0 0-3-3m0 8a5 5 0 0 1-5-5a5 5 0 0 1 5-5a5 5 0 0 1 5 5a5 5 0 0 1-5 5m0-12.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5" />
            </svg>
            Preview
          </button>
        </div>
      </div>

      <div class="project-content">
        <h2>{{ project.title }}</h2>
        <p class="project-description">{{ project.description }}</p>

        <div class="tech-stack">
          <span class="tech-pill" *ngFor="let tech of project.techStack">{{ tech }}</span>
        </div>

        <div class="project-links">
          <button class="project-btn github-btn" (click)="openLink(project.github)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">
              <path fill="currentColor"
                d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33s1.71.11 2.5.33c1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2" />
            </svg>
            GitHub
          </button>
          <button class="project-btn demo-btn" *ngIf="project.demo" (click)="openLink(project.demo)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">
              <path fill="currentColor"
                d="M14 3v2h3.59l-9.83 9.83l1.41 1.41L19 6.41V10h2V3m-2 16H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2z" />
            </svg>
            Live Demo
          </button>
        </div>
      </div>
    </div>
  </div>
</section>

<app-footer></app-footer>
